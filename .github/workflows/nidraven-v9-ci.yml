name: NIDRAVEN V9 CI
on:
  push:
    branches: [feature/v8-multiplayer-server]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check syntax
        run: |
          node --check server.js
          node --check social.js
          node --check db-postgres.js
          node --check save-queue.js
      - name: Run unit and protocol tests
        run: npm test
