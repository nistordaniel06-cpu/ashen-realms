<script>
/* ===== NIDRAVEN · client single-file · Canvas 2D =====
   Module map: Util · Draw helpers · AssetManager (A) · Anim/CharacterRenderer · World (terrain, objects)
   Game logic (upd) · EnvironmentRenderer · CameraController (cam) · MobileHUD · Input */
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const root=document.documentElement;
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t*t*(3-2*t);
const iso=(x,y)=>[(x-y)*32,(x+y)*16];
const _mc={};function mixHex(a,b,t){t=Math.round(t*20)/20;const k=a+b+t;if(_mc[k])return _mc[k];const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const r=((pa>>16)&255)*(1-t)+((pb>>16)&255)*t,gg=((pa>>8)&255)*(1-t)+((pb>>8)&255)*t,bl=(pa&255)*(1-t)+(pb&255)*t;return _mc[k]='#'+((1<<24)|(Math.round(r)<<16)|(Math.round(gg)<<8)|Math.round(bl)).toString(16).slice(1)}
let sd=7;const R=()=>(sd=(sd*16807)%2147483647)/2147483647;
const hs=(i,j)=>{let h=Math.imul(i,374761393)^Math.imul(j,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295};
function vn(x,y){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);return lerp(lerp(hs(i,j),hs(i+1,j),u),lerp(hs(i,j+1),hs(i+1,j+1),u),v)}

/* ---- draw helpers (draw into g: screen ctx or a bake ctx) ---- */
let g=cx;const OL='rgba(28,16,10,.62)';
const pathp=p=>{g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.closePath()};
const fp=(p,c,s)=>{pathp(p);g.fillStyle=c;g.fill();if(s){g.strokeStyle=s;g.lineWidth=.8;g.lineJoin='round';g.stroke()}};
const ell=(x,y,rx,ry,c,s)=>{g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);g.fillStyle=c;g.fill();if(s){g.strokeStyle=s;g.lineWidth=.8;g.stroke()}};
const rect=(x,y,w,h,c,s,r)=>{g.beginPath();if(r&&g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h);g.fillStyle=c;g.fill();if(s){g.strokeStyle=s;g.lineWidth=.8;g.stroke()}};
const seg=(x1,y1,x2,y2,w,c)=>{g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.lineWidth=w;g.strokeStyle=c;g.lineCap='round';g.stroke()};
const rr=(x,y,w,h,r)=>{g.beginPath();g.roundRect(x,y,w,h,r)};
function mk(w,h,fn,sc){sc=sc||2;const c=document.createElement('canvas');c.width=Math.ceil(w*sc);c.height=Math.ceil(h*sc);const x=c.getContext('2d');x.scale(sc,sc);const og=g;g=x;fn(x);g=og;return c}
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ===== ASSET MANAGER: terrain tiles, edge blends, sprites (procedural placeholders, baked once at 2x) ===== */
const A={til:[[],[],[],[],[],[],[]],edge:{},spr:{}};
(function bakeAssets(){
const dia=c=>{c.beginPath();c.moveTo(32,0);c.lineTo(64,16);c.lineTo(32,32);c.lineTo(0,16);c.closePath()};
const tile=fn=>mk(64,32,c=>{dia(c);c.clip();fn(c)});
for(let k=0;k<6;k++){const l=33+k*2.4;A.til[0].push(tile(c=>{c.fillStyle='hsl('+(99+k*1.5)+','+(40+k)+'%,'+l+'%)';c.fillRect(0,0,64,32);for(let n=0;n<26;n++){const x=rnd(0,64),y=rnd(0,32);ell(x,y,rnd(1.5,4),rnd(.8,1.8),'hsla('+rnd(92,112)+',45%,'+(l+rnd(-5,6))+'%,.35)')}for(let n=0;n<30;n++){const x=rnd(2,62),y=rnd(2,30),h=rnd(1.5,3.2),d=rnd(-1,1);seg(x,y,x+d,y-h,.7,'hsla('+rnd(88,108)+',48%,'+(l+rnd(4,13))+'%,.7)')}}))}
for(let k=0;k<3;k++)A.til[1].push(tile(c=>{c.fillStyle='hsl(32,'+(30+k*2)+'%,'+(37+k*2)+'%)';c.fillRect(0,0,64,32);for(let n=0;n<28;n++)ell(rnd(0,64),rnd(0,32),rnd(1,3.5),rnd(.6,1.6),'hsla(30,28%,'+rnd(26,52)+'%,.4)');for(let n=0;n<6;n++)ell(rnd(6,58),rnd(4,28),rnd(.8,1.6),rnd(.6,1.1),'#b5a58a')}));
for(let k=0;k<3;k++)A.til[2].push(tile(c=>{c.fillStyle='#a38662';c.fillRect(0,0,64,32);for(let n=0;n<14;n++){const x=rnd(4,60),y=rnd(3,29),w=rnd(5,9),h=rnd(2.5,4.2);ell(x,y,w,h,'hsl(35,'+rnd(14,24)+'%,'+rnd(48,62)+'%)','rgba(60,40,20,.35)');ell(x-1,y-.8,w*.55,h*.45,'rgba(255,255,255,.12)')}}));
for(let k=0;k<3;k++)A.til[3].push(tile(c=>{const gr=c.createLinearGradient(0,0,0,32);gr.addColorStop(0,'#4a8fbd');gr.addColorStop(1,'#2f6c9c');c.fillStyle=gr;c.fillRect(0,0,64,32);for(let n=0;n<7;n++)ell(rnd(4,60),rnd(4,28),rnd(3,8),rnd(1,2),'rgba(255,255,255,.07)')}));
for(let k=0;k<3;k++)A.til[4].push(tile(c=>{c.fillStyle='hsl(46,'+(48+k*3)+'%,'+(70+k*2)+'%)';c.fillRect(0,0,64,32);for(let n=0;n<34;n++)ell(rnd(0,64),rnd(0,32),rnd(.6,1.6),rnd(.4,1),'hsla(40,40%,'+rnd(48,82)+'%,.55)')}));
for(let k=0;k<4;k++)A.til[5].push(tile(c=>{const l=21+k*2;c.fillStyle='hsl(255,9%,'+l+'%)';c.fillRect(0,0,64,32);seg(32,0,32,32,.8,'rgba(0,0,0,.35)');seg(0,16,64,16,.8,'rgba(0,0,0,.35)');seg(32,0,64,16,.7,'rgba(255,255,255,.07)');for(let n=0;n<18;n++)ell(rnd(0,64),rnd(0,32),rnd(.8,3),rnd(.5,1.4),'hsla(255,8%,'+rnd(14,34)+'%,.5)');if(k==1){seg(10,10,24,18,.7,'rgba(0,0,0,.5)');seg(24,18,30,26,.7,'rgba(0,0,0,.5)')}}));
A.til[6].push(tile(c=>{c.fillStyle='#0b0911';c.fillRect(0,0,64,32)}));
const mids=[[48,8],[48,24],[16,24],[16,8]],inw=[[-.89,.45],[-.89,-.45],[.89,-.45],[.89,.45]],ec={1:'#8a6b45',2:'#a38662',4:'#d9c58d',3:'#2f6c9c'};
for(const t in ec){A.edge[t]=[];for(let s=0;s<4;s++)A.edge[t].push(tile(c=>{const[mx,my]=mids[s],[ix,iy]=inw[s],gr=c.createLinearGradient(mx,my,mx+ix*15,my+iy*15);gr.addColorStop(0,ec[t]);gr.addColorStop(.35,ec[t]+'bb');gr.addColorStop(1,ec[t]+'00');c.fillStyle=gr;c.fillRect(0,0,64,32);for(let n=0;n<8;n++){const f=rnd(.1,.9),px=lerp(mx,mx+ix*10,Math.random()*.9)+rnd(-8,8),py=lerp(my,my+iy*10,Math.random()*.9)+rnd(-4,4);ell(px,py,rnd(.8,2),rnd(.5,1),ec[t]+'aa')}}))}
/* trees */
function tree(v){const w=140,h=180;return{c:mk(w,h,()=>{ell(84,158,36,10,'rgba(0,0,0,.28)');
if(v==2){rect(64,138,12,20,'#5e4126',OL,2);rect(64,138,4,20,'rgba(255,255,255,.12)');const T=[[86,60,34],[68,48,28],[52,38,22],[36,28,16]];for(const[y,wd,hh]of[[132,42,38],[104,36,34],[76,29,31],[50,21,28]]){fp([70-wd,y,70,y-hh-6,70+wd,y],'#215e2c',OL);fp([70-wd,y,70,y-hh-6,70,y],'#2f8a3a');fp([70-wd*.55,y-6,70,y-hh-6,70-wd*.1,y-8],'rgba(130,210,110,.35)')}return}
const base=v==0?['#245f2b','#3a8d3e','#62b258']:['#2d6a22','#54902c','#86b83e'];
for(const k of[[0,-6]])rect(63,118,15,42,'#6b4a2b',OL,3);fp([58,160,82,160,76,142,64,142],'#6b4a2b');rect(70,118,8,42,'rgba(0,0,0,.22)');rect(64,120,3,38,'rgba(255,255,255,.14)');seg(68,134,71,142,.8,'rgba(0,0,0,.35)');
const cl=v==0?[[70,92,34],[42,100,24],[100,100,25],[52,70,26],[88,72,25],[70,50,23]]:[[70,96,32],[46,92,23],[96,96,26],[56,66,25],[86,64,24],[72,40,20]];
cl.forEach(([x,y,r])=>ell(x,y+5,r,r*.9,base[0],'#16401b'));cl.forEach(([x,y,r])=>ell(x-2,y-1,r*.9,r*.82,base[1]));cl.forEach(([x,y,r])=>ell(x-8,y-9,r*.52,r*.4,base[2]));
for(let n=0;n<40;n++){const q=cl[n%cl.length],a=rnd(0,TAU),d=rnd(0,q[2]*.8);ell(q[0]+Math.cos(a)*d,q[1]+Math.sin(a)*d*.8,rnd(1.4,3),rnd(1,2),n%2?base[2]+'cc':base[0]+'aa')}
if(v==1)for(const[x,y]of[[50,60],[92,80],[70,104]])ell(x,y,2.4,1.9,'#e8c14a')
}),ax:70,ay:158,w,h}}
A.spr.tree=[tree(0),tree(1),tree(2)];
A.spr.stump={c:mk(40,34,()=>{ell(22,28,13,4,'rgba(0,0,0,.25)');rect(10,14,20,14,'#6b4a2b',OL,3);ell(20,14,10,4.5,'#c9a06a',OL);ell(20,14,6,2.6,'#b8895a');ell(20,14,2.6,1.2,'#9a7040');rect(11,15,3,12,'rgba(255,255,255,.12)')}),ax:20,ay:28,w:40,h:34};
function rock(v){return{c:mk(60,50,()=>{ell(34,40,22,6,'rgba(0,0,0,.28)');const p=v?[8,34,14,16,26,6,42,10,52,26,50,38,30,42]:[6,36,10,20,22,8,40,8,52,22,54,36,32,42];fp(p,'#8d8c85',OL);fp([p[0],p[1],p[2],p[3],p[4],p[5],26,22,24,40],'#b3b2aa');fp([p[8],p[9],p[10],p[11],p[12],p[13],30,42,26,22],'#6c6b66');fp([p[4],p[5],p[6],p[7],p[8],p[9],26,22],'#c6c5bd');seg(24,22,20,36,.8,'rgba(0,0,0,.35)');seg(30,12,34,22,.7,'rgba(0,0,0,.3)');ell(18,14,5,2.4,'#5f8f3e');ell(22,12,3,1.5,'#79a850')}),ax:30,ay:40,w:60,h:50}}
A.spr.rock=[rock(0),rock(1)];
A.spr.pebble={c:mk(34,16,()=>{ell(10,10,5,2.8,'#8d8c85',OL);ell(22,8,4,2.4,'#a3a29a',OL);ell(16,12,3,1.8,'#77766f')}),ax:17,ay:10,w:34,h:16};
function bush(v){return{c:mk(40,30,()=>{ell(22,25,15,4,'rgba(0,0,0,.22)');[[12,18,9],[26,18,10],[19,11,10]].forEach(([x,y,r])=>ell(x,y,r,r*.85,'#2c6b2c',OL));[[12,16,7],[26,16,8],[19,9,8]].forEach(([x,y,r])=>ell(x-1.5,y-2,r*.8,r*.65,'#468f3c'));if(v)for(const[x,y]of[[14,14],[24,10],[28,19],[18,17]])ell(x,y,1.6,1.6,'#d6403a');else for(const[x,y]of[[14,10],[26,12]])ell(x,y,2,1.5,'#79b856')}),ax:20,ay:24,w:40,h:30}}
A.spr.bush=[bush(0),bush(1)];
A.spr.flower=['#f4f1e8','#f2cf4a','#e98fb5','#8fb5f0'].map(col=>({c:mk(26,18,()=>{[[6,12],[13,8],[20,13],[11,15]].forEach(([x,y],i)=>{seg(x,y,x,y+4,.8,'#3d7a35');ell(x,y,2.1,1.7,i%2?col:mixHex(col.length==7?col:'#ffffff','#ffffff',.3));ell(x,y,.8,.7,'#d99a2a')})}),ax:13,ay:15,w:26,h:18}));
A.spr.tuft={c:mk(18,12,()=>{for(let k=0;k<5;k++)seg(4+k*2.4,11,3+k*3,rnd(2,6),1,'hsl('+rnd(90,110)+',45%,'+rnd(34,48)+'%)')}),ax:9,ay:11,w:18,h:12};
A.spr.mush={c:mk(18,16,()=>{rect(7,8,3,6,'#e9dfc8',OL,1);ell(8.5,8,5,3.2,'#c0392b',OL);ell(7,7,.9,.8,'#fff');ell(10.5,8,.8,.7,'#fff');rect(13,10,2,4,'#e9dfc8');ell(14,10,3,2,'#d85a30')}),ax:9,ay:14,w:18,h:16};
A.spr.reed={c:mk(20,30,()=>{for(let k=0;k<5;k++){const x=4+k*3;seg(x,28,x+rnd(-2,2),rnd(4,12),1.2,'#6f8f3a');if(k%2)ell(x,rnd(4,10),1.2,3.2,'#6b4a2b')}}),ax:10,ay:28,w:20,h:30};
A.spr.crate={c:mk(30,30,()=>{ell(16,26,12,4,'rgba(0,0,0,.25)');fp([4,12,16,18,16,28,4,22],'#9a6c3a',OL);fp([16,18,28,12,28,22,16,28],'#7b5329',OL);fp([4,12,16,6,28,12,16,18],'#b98b52',OL);seg(10,15,10,25,.8,'rgba(0,0,0,.3)')}),ax:16,ay:26,w:30,h:30};

/* ===== ANIMATION CONTROLLER ===== */
class Anim{constructor(){this.name='idle';this.t=Math.random()*3;this.len=0;this.lock=0;this.s=2;this.flash=0;this.tool=null}
p(){return this.len?clamp(this.t/this.len,0,1):0}
play(n,len,tool){this.name=n;this.t=0;this.len=len;this.lock=len;this.tool=tool||null}
face(sx,sy){if(sx*sx+sy*sy>1e-4)this.s=((Math.round(Math.atan2(sy,sx)/(Math.PI/4))%8)+8)%8}
update(dt,mv,run){this.t+=dt;if(this.flash>0)this.flash-=dt;if(this.name==='death')return;if(this.lock>0){this.lock-=dt;if(this.lock>0)return;this.lock=0;this.len=0;this.tool=null}const n=mv?(run?'run':'walk'):'idle';if(n!==this.name){this.name=n;this.t=0}}
hit(){this.flash=.3;if(this.lock<=0||this.name==='hit')this.play('hit',.28)}}
function poseOf(a){const n=a.name,t=a.t,o={bob:0,lunge:0,lean:0,l:0,r:0,ll:0,rl:0,al:0,ar:0,act:null,psi:null,cast:0,crouch:0};
if(n==='idle'){const b=Math.sin(t*2.4);o.bob=b*.7;o.al=b*.12;o.ar=-b*.12}
else if(n==='walk'||n==='run'||n==='dash'){const w=n==='walk',f=w?9:13,am=w?.75:1,ph=t*f,s=Math.sin(ph),c=Math.cos(ph);o.l=s*am;o.r=-s*am;o.ll=Math.max(0,c)*(w?2.2:3.2);o.rl=Math.max(0,-c)*(w?2.2:3.2);o.bob=-Math.abs(s)*(w?1.4:2.4);o.lean=w?0:n==='dash'?4:2;o.al=-s*am;o.ar=s*am;if(n==='dash'){o.al=-.9;o.ar=-.9}}
else if(n==='attack'){const p=a.p();let th,ps;if(p<.3){const u=ease(p/.3);th=lerp(.25,2.7,u);ps=lerp(2.5,3.9,u)}else if(p<.58){const u=ease((p-.3)/.28);th=lerp(2.7,1.1,u);ps=lerp(3.9,1.2,u);o.lunge=3*u}else{const u=ease((p-.58)/.42);th=lerp(1.1,.25,u);ps=lerp(1.2,2.5,u);o.lunge=3*(1-u)}o.act=th;o.psi=ps}
else if(n==='cast'){const p=a.p();let th,ps;if(p<.45){const u=ease(p/.45);th=lerp(.25,2.9,u);ps=lerp(3.1,3.3,u);o.cast=u}else if(p<.7){const u=ease((p-.45)/.25);th=lerp(2.9,1.5,u);ps=lerp(3.3,1.9,u);o.cast=1;o.lunge=2*u}else{const u=ease((p-.7)/.3);th=lerp(1.5,.25,u);ps=lerp(1.9,3.1,u);o.cast=1-u;o.lunge=2*(1-u)}o.act=th;o.psi=ps}
else if(n==='hit'){const u=Math.sin(a.p()*Math.PI);o.lean=-3*u;o.crouch=1.5*u;o.al=.8*u;o.ar=.8*u;o.bob=u}
else if(n==='death'){o.al=1;o.ar=-.6}
return o}

function inShape(e,x,y,pad){pad=pad||.3;const dx=x-e.x,dy=y-e.y;if(e.k=='circ'||e.k=='zone')return Math.hypot(dx,dy)<e.r+pad;
if(e.k=='cone'){const d=Math.hypot(dx,dy);if(d>e.r+pad)return false;if(d<.6)return true;let da=Math.atan2(dy,dx)-e.a;da=Math.atan2(Math.sin(da),Math.cos(da));return Math.abs(da)<e.w}
if(e.k=='line'){const ux=Math.cos(e.a),uy=Math.sin(e.a),along=dx*ux+dy*uy,perp=Math.abs(-dx*uy+dy*ux);return along>-.3&&along<e.len+pad&&perp<e.wd/2+pad}
return false}
function updTG(dt){for(let i=TG.length-1;i>=0;i--){const e=TG[i];
if(e.k=='zone'){e.t-=dt;if(e.pre>0){e.pre-=dt}else{e.tk=(e.tk||0)-dt;if(e.tk<=0){e.tk=.5;if(!P.dying&&inShape(e,P.x,P.y,0))hurtP(e.dmg,e.by,{fx:e.fx,pierce:1})}}if(e.t<=0)TG.splice(i,1);continue}
if(e.by&&(e.by.dead||(e.by.sx&&e.by.sx.stun))){TG.splice(i,1);continue}
if(e.follow&&e.by){e.x=e.by.x;e.y=e.by.y}
e.t-=dt;if(e.t<=0){if(!P.dying&&inShape(e,P.x,P.y))hurtP(e.dmg,e.by,{fx:e.fx});fxl.push({k:'burst',x:e.x+(e.k=='line'?Math.cos(e.a)*e.len:e.k=='cone'?Math.cos(e.a)*e.r*.6:0),y:e.y+(e.k=='line'?Math.sin(e.a)*e.len:e.k=='cone'?Math.sin(e.a)*e.r*.6:0),t:.35,tt:.35,r:e.k=='circ'?e.r:Math.min(e.r||1.4,1.6),c:e.c2||'#ff7a5a'});cam.sh=Math.max(cam.sh,e.by&&e.by.big?.3:.1);sfx('boom');if(e.done)e.done(e);TG.splice(i,1)}}}

function pickTarget(range){const fv=fvOf();let best=null,bs=1e9;for(const s of sl){if(s.dead||s.inv>0)continue;const dx=s.x-P.x,dy=s.y-P.y,d=Math.hypot(dx,dy);if(d>range)continue;const ca=(dx*fv.x+dy*fv.y)/(d||1);let sc=d*(1.6-.6*ca);if(P.tgt===s)sc*=.6;if(sc<bs){bs=sc;best=s}}return best}
function aimAt(range){const t=OPT.at?pickTarget(range):null;P.tgt=OPT.at?t:null;let dx,dy;if(t){dx=t.x-P.x;dy=t.y-P.y}else{dx=fvOf().x;dy=fvOf().y}const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;P.fv={x:dx,y:dy};faceDirW(dx,dy);return{t,dx,dy}}

if(c==2&&P.mp<3){say(P.x,P.y,'Fără mana','#8fb5ff');P.cd=.4;return}
const rng=[0,2.1,0,0,1.8][c],a=aimAt(c==1||c==4?rng+1.2:8);P.cd=cdT;P.cmbT=1.2;
if(c==1||c==4){P.cmb=(P.cmb+1)%3;const fin=P.cmb==0,mult=c==1?(fin?1.55:1):(fin?.95:.62);as.play('attack',c==4?.25:.36);fxl.push({k:'slash',x:P.x,y:P.y,s:as.s,t:.22});const fv=a.t?{x:a.dx,y:a.dy}:fvOf();let n=0;
for(const s of sl.slice()){if(s.dead||s.inv>0)continue;const dx=s.x-P.x,dy=s.y-P.y,d=Math.hypot(dx,dy);if(d-(s.big?.7:.3)>rng)continue;const ca=(dx*fv.x+dy*fv.y)/(d||1);if(d>.7&&ca<(c==1?.3:.45))continue;hitMon(s,mult,{kb:c==1?(fin?1.3:.55):.35,melee:1});n++}
if(!n){say(P.x,P.y,'Ratat','#aaa');sfx('dash')}else if(fin)cam.sh=Math.max(cam.sh,.2)}

const mx=d.stack||99;let room=0;for(const s of arr){if(!s)room+=mx;else if(s.id==q.id&&!s.x)room+=mx-s.n}if(room<q.n)return false;
let n=q.n;for(const s of arr)if(s&&s.id==q.id&&!s.x&&s.n<mx&&n>0){const a=Math.min(mx-s.n,n);s.n+=a;n-=a}
for(let i=0;i<arr.length&&n>0;i++)if(!arr[i]){const a=Math.min(mx,n);arr[i]={id:q.id,n:a};n-=a}return true}
function bankMove(src,i,dst,one){const q=src[i];if(!q)return false;const d=IT[q.id],inst=d.slot||q.x;const m=inst?q:{id:q.id,n:one?1:q.n};
if(!slotsPut(dst,m))return false;if(inst||m.n==q.n)src[i]=null;else q.n-=m.n;return true}

function arenaPool(){return P.lv<8?['slime','wolf','slime']:P.lv<15?['wolf','goblin','bandit','skeleton']:['skeleton','bandit','archer','mage','goblin']}
function arenaWave(){ARN.wave++;const pool=arenaPool(),n=2+ARN.wave;const cxn=22,cyn=10;
for(let i=0;i<n;i++){const t=pool[i%pool.length],a=i/n*TAU,c=MC[t],lv=Math.max(c.lv[0],Math.min(P.lv+ARN.wave-1,c.lv[1]+8));const o=(ARN.wave==3&&i==0)?{el:ELK[(i+P.lv)%ELK.length]}:undefined;
const m=addMon(t,cxn+Math.cos(a)*4.2,cyn+Math.sin(a)*2.6,lv,o);m.arena=1;m.ev=1;m.st='chase';m.rt=-1e9}
toast('Valul '+ARN.wave+'/'+ARN.N);sfx('ui')}
